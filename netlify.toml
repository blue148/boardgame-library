[build]
  command = "npm run build"
  publish = "dist"

# Environment variables (set these in Netlify UI instead)
# VITE_SUPABASE_URL
# VITE_SUPABASE_ANON_KEY

# Exclude VITE_ environment variables from secret scanning
# These are meant to be public and embedded in the client bundle
# Supabase anon keys are protected by Row Level Security (RLS)
[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=*, geolocation=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cf.geekdo-images.com https://api.dicebear.com https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self';"
